      <button mat-raised-button color="accent" (click)="finishAppointment()" class="btn-done">DONE</button>

  <div class="my-referrals-container">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z1">
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef><mat-checkbox (change)="$event ? masterToggle() : null"
        [checked]="selection.hasValue() && isAllSelected()"
        [indeterminate]="selection.hasValue() && !isAllSelected()"></mat-checkbox> </th>

      <td mat-cell *matCellDef="let row"><mat-checkbox (click)="$event.stopPropagation()"
        (change)="$event ? selection.toggle(row) : null"
        [checked]="selection.isSelected(row)"></mat-checkbox></td>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let referral"> {{referral.name}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="insurance">
      <th mat-header-cell *matHeaderCellDef> Insurance </th>
      <td mat-cell *matCellDef="let referral"> {{referral.insurance}} </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="clinic">
      <th mat-header-cell *matHeaderCellDef> Clinic </th>
      <td mat-cell *matCellDef="let referral"> {{referral.clinic}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="time">
      <th mat-header-cell *matHeaderCellDef> Time </th>
      <td mat-cell *matCellDef="let referral"> {{referral.time}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="booked date">
      <th mat-header-cell *matHeaderCellDef> Booked Date </th>
      <td mat-cell *matCellDef="let referral"> {{referral.bookedDate | date}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="contact">
      <th mat-header-cell *matHeaderCellDef> Contact </th>
      <td mat-cell *matCellDef="let referral"> {{referral.contact}}
          <button mat-icon-button matTooltip="Cancel Referral" (click)="cancelReferral(referral)">
              <mat-icon>delete</mat-icon>
            </button>
      </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="reason">
      <th mat-header-cell *matHeaderCellDef>Reason</th>
      <td mat-cell *matCellDef="let referral"> {{referral.reason}} </td>
    </ng-container>

    <!-- Symbol Column -->

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  </div>
</div>
