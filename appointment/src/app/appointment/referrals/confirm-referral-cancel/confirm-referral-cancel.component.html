<h2 mat-dialog-title>Cancel this Referral</h2>
<mat-dialog-content>
  <p>Are you sure you want to cancel this Referral?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close="no">No</button>
  <button mat-button [mat-dialog-close]="{referralId: referralId}">Yes</button>
</mat-dialog-actions>
