  <div id="contentContainer">
    <div class="spinner-container" *ngIf="isLoading">
      <mat-spinner [strokeWidth]="5" [diameter]="60"></mat-spinner>
    </div>

    <div class="welcome-msg" *ngIf="loggedInAlready">Hi {{ firstname }}! What would you like to start with?</div>
    <!-- <div style="width: 100%; height: calc(100vh - 120px); flex-direction: column; display: flex; align-items: center; justify-content: center;">
      <div class="welcome-msg">Hi {{ firstname }}! Please use the Consultation Software to book appointments</div>
      <div class="sub">However, you can see the appointments already made on this system</div>
    </div> -->

    <mat-grid-list cols="2" gutterSize="10" *ngIf="!isLoading">
      <mat-grid-tile>
        <button mat-raised-button color="primary" matTooltip="Add New Patient to be Reviewed"
          (click)="openAddNewReviewDialog()">
          <mat-icon>add</mat-icon>
          <p>Add Review</p>
        </button>
      </mat-grid-tile>

      <mat-grid-tile>
        <button color="accent" mat-raised-button matTooltip="Refer a new Patient" (click)="openNewReferralDialog()">
          <mat-icon>add</mat-icon>
          <p>New Referral</p>
        </button>
      </mat-grid-tile>

      <!-- <mat-grid-tile *ngIf="isEditor || isSystemAdmin">
        <button mat-raised-button matTooltip="Show all Patients to be Reviewed" routerLink="/appointment/doctor-reviews">
          <mat-icon>group</mat-icon>
          <p>View All</p>
        </button>
      </mat-grid-tile> -->
    </mat-grid-list>
  </div>
