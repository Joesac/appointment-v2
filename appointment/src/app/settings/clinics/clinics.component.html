<div class="all-clinics-container">
  <div class="spinner-container" *ngIf="isLoading">
      <mat-spinner [strokeWidth]="5" [diameter]="60"></mat-spinner>
  </div>

  <div class="all-users-container">
      <mat-form-field>
        <input matInput placeholder="Clinic Name" [(ngModel)]="clinic">
      </mat-form-field>
      <button mat-button (click)="addClinic(clinic)">Add</button>
  </div>

  <div class="all-users-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z1">
      <!-- Position Column -->
      <ng-container matColumnDef="serial">
        <th mat-header-cell *matHeaderCellDef> No. </th>
        <td mat-cell *matCellDef="let clinic; let i = index"> {{ i + 1}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Descripton </th>
        <td mat-cell *matCellDef="let clinic"> {{clinic.name}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
